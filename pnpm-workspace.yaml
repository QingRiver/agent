overrides:
  '@langchain/langgraph-checkpoint': 'catalog:'
  # MCP SDK 自己的依赖仍解析到 hono 4.12.32；公告要求 >=4.13.7，范围 ^4.11.4 允许 catalog。
  hono: 'catalog:'
  '@hono/node-server': 'catalog:'
  # eslint 的 micromark 仍会拉 katex 0.16；0.18.11 同时满足它的 ^0.16 和 marked-katex 的 <0.19。
  katex: 'catalog:'
  # Node 26 内置 undici@8。qdrant 客户端用 npm 的 undici.Agent 再交给 global fetch，
  # 两边主版本不一致就会 UND_ERR_INVALID_ARG。钉在 7.x 可同时兼容 Node 22/24/26
  # （8.x 在 Node 24 会挂）。7.30.0 盖住 >=7.29.1 的安全公告，仍留在 7.x。
  # qdrant-js#146 仍未合并；那条 PR 发版后再去掉本 override。
  undici: 7.30.0

shellEmulator: true
